name: Refresh repository snapshot

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - name: Check the fortnightly schedule
        id: cadence
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Anchor on the existing Monday snapshot. Elapsed weeks work across year boundaries.
          anchor=$(date -u -d 2026-11-16 +%s)
          weeks=$(( ($(date -u +%s) - anchor) / 604800 ))
          if [[ "$EVENT" == workflow_dispatch ]] || (( weeks % 2 == 0 )); then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.cadence.outputs.due == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v6
        if: steps.cadence.outputs.due == 'true'
        with:
          python-version: '3.11'

      - name: Collect repositories
        if: steps.cadence.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install .
          esprit-tracker all-repos --json public/data.json

      - name: Save the completed snapshot
        if: steps.cadence.outputs.due == 'true'
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh repository snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: refresh
    if: needs.refresh.outputs.revision != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ needs.refresh.outputs.revision }}
